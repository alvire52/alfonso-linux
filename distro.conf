# ============================================================
#  Configurazione della distro — modifica qui e rilancia build.sh
# ============================================================

# Identità
DISTRO_NAME="ALFONSO"            # nome visualizzato
DISTRO_ID="alfonso"              # minuscolo, senza spazi (nome ISO, hostname)
DISTRO_VERSION="1.0"
PUBLISHER="Alfonso"

# Desktop environment: gnome | kde | xfce | cinnamon | mate | lxqt
DESKTOP="kde"

# Tema icone (stile Apple): WhiteSur | WhiteSur-light | WhiteSur-dark
ICON_THEME="WhiteSur"

# Lingua, tastiera, fuso orario
LOCALE="it_IT.UTF-8"
KEYMAP="it"
TIMEZONE="Europe/Rome"
LANG_PACKAGES="task-italian task-italian-desktop"

# Utente della sessione live (password: live)
LIVE_USER="live"

# Programmi dai repository Debian (separati da spazio)
EXTRA_PACKAGES="libreoffice libreoffice-l10n-it vlc \
qbittorrent cpu-x qdiskinfo smartmontools \
fastfetch htop git curl wget vim \
flatpak ufw gufw"

# Programmi da rimuovere anche se richiamati dal desktop
REMOVE_PACKAGES="firefox-esr thunderbird gimp timeshift \
kmail korganizer kaddressbook akregator \
dragonplayer juk kmix skanlite \
konqueror konq-plugins kdeconnect orca kdeaccessibility kmag kmousetool kmouth sweeper \
khelpcenter libreoffice-impress kwalletmanager"

# Programmi da Flathub
FLATPAKS="org.jdownloader.JDownloader"

# Google Chrome (repository ufficiale Google): yes | no
INSTALL_CHROME="yes"
