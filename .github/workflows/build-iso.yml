name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['distro.conf', 'build.sh', 'overlay/**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Costruisci la ISO (container Debian 13)
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie \
            bash -c "apt-get update && apt-get install -y live-build && bash build.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            output/*.iso
            output/SHA256SUMS
          compression-level: 0
          retention-days: 7
